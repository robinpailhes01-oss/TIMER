<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="FocusFlow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffba85"/>
      <stop offset="55%" stop-color="#ff7a2b"/>
      <stop offset="100%" stop-color="#ff4d00"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5e9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.7">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- squircle background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- soft top-left highlight -->
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- timer ring -->
  <g transform="translate(256 256)">
    <!-- track -->
    <circle r="148" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="30"/>
    <!-- progress arc (~75%) -->
    <circle r="148" fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round"
            stroke-dasharray="697 930" transform="rotate(-90)"/>
    <!-- knob at end of arc -->
    <circle cx="0" cy="-148" r="18" fill="#ffffff"/>
    <circle cx="0" cy="-148" r="9" fill="#ff4d00"/>

    <!-- center play triangle -->
    <path d="M-30 -42 L52 0 L-30 42 Z" fill="#ffffff" filter="url(#shadow)"/>
  </g>
</svg>
